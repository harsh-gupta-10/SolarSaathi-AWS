AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SolarSaathi authenticated roof, planning, policy evidence and grounded advisor APIs with scheduled official-source review.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: README.md
        has: Phase 0 resource intent, logging and deployment constraints

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  ApplicationOrigin:
    Type: String
    Default: https://app.solarsaathi.in
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$|^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    Description: Exact application origin, no trailing slash; localhost HTTP is for development only.
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    Description: Globally unique Cognito login prefix; choose explicitly before deployment.
  EnableGoogleFederation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  GoogleOAuthClientId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$'
    Description: Google OAuth web client ID, required only when federation is enabled.
  GoogleOAuthSecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing a clientSecret JSON key; never a plaintext secret.
  GoogleGeocodingKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing an apiKey JSON key for server-side Geocoding requests.
  GoogleSolarKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing an apiKey JSON key for server-side Solar requests.
  AdvisorBedrockModelId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S{1,2048}$'
    Description: Optional Bedrock model ID or ARN for fact-card selection; blank uses deterministic fallback.
  AdvisorBedrockModelArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):bedrock:[a-z0-9-]+:([0-9]{12})?:(foundation-model|inference-profile|application-inference-profile)/.+$'
    Description: Exact IAM resource ARN for the configured advisor model or inference profile.
  AdvisorBedrockFoundationModelArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):bedrock:[a-z0-9*_-]+::foundation-model/[A-Za-z0-9._:-]+$'
    Description: For an advisor inference profile, also grant its routed foundation model ARN, using wildcard region when required.
  AdvisorBedrockRegion:
    Type: String
    Default: ap-south-1
    AllowedPattern: '^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]+$'
    Description: Region used for optional Bedrock fact-card selection.
  DesignImageModelId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^amazon\.nova-canvas-v[0-9]+:[0-9]+$'
    Description: Optional Nova Canvas image model; blank keeps deterministic template and 3D concepts.
  DesignImageRegion:
    Type: String
    Default: ap-south-1
    AllowedPattern: '^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]+$'
    Description: Region for optional Nova Canvas image generation.

Conditions:
  GoogleFederationEnabled: !Equals [!Ref EnableGoogleFederation, "true"]
  GeocodingConfigured: !Not [!Equals [!Ref GoogleGeocodingKeySecretArn, ""]]
  SolarConfigured: !Not [!Equals [!Ref GoogleSolarKeySecretArn, ""]]
  AdvisorBedrockConfigured: !Not [!Equals [!Ref AdvisorBedrockModelArn, ""]]
  AdvisorFoundationModelConfigured: !Not [!Equals [!Ref AdvisorBedrockFoundationModelArn, ""]]
  DesignImageConfigured: !Not [!Equals [!Ref DesignImageModelId, ""]]

Rules:
  GoogleConfigurationRequired:
    RuleCondition: !Equals [!Ref EnableGoogleFederation, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoogleOAuthClientId, ""]]
        AssertDescription: Google federation requires an OAuth client ID.
      - Assert: !Not [!Equals [!Ref GoogleOAuthSecretArn, ""]]
        AssertDescription: Google federation requires a Secrets Manager ARN.
  AdvisorModelConfigurationPaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref AdvisorBedrockModelId, ""]
            - !Equals [!Ref AdvisorBedrockModelArn, ""]
          - !And
            - !Not [!Equals [!Ref AdvisorBedrockModelId, ""]]
            - !Not [!Equals [!Ref AdvisorBedrockModelArn, ""]]
        AssertDescription: Advisor Bedrock model ID and exact IAM resource ARN must both be set or both blank.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        API_ALLOWED_ORIGIN: !Ref ApplicationOrigin
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        COGNITO_REGION: !Ref AWS::Region
    Tags:
      Project: SolarSaathi
      Environment: !Ref Environment

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${ApplicationOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${ApplicationOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"error":{"code":"GATEWAY_REQUEST_ERROR","message":"Check your sign-in session and request.","requestId":"$context.requestId"}}'
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${ApplicationOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"error":{"code":"GATEWAY_SERVICE_ERROR","message":"The service is unavailable. Try again later.","requestId":"$context.requestId"}}'
      Auth:
        DefaultAuthorizer: CognitoUserPool
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoUserPool:
            UserPoolArn: !GetAtt UserPool.Arn
            AuthorizationScopes:
              - aws.cognito.signin.user.admin
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/health"
      RetentionInDays: !Ref LogRetentionDays

  AnalyzeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/analyze"
      RetentionInDays: !Ref LogRetentionDays

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/advisor"
      RetentionInDays: !Ref LogRetentionDays

  ProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/identity"
      RetentionInDays: !Ref LogRetentionDays

  CoreLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/core"
      RetentionInDays: !Ref LogRetentionDays

  RoofLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/roof"
      RetentionInDays: !Ref LogRetentionDays

  SystemsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/systems"
      RetentionInDays: !Ref LogRetentionDays

  DesignsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/designs"
      RetentionInDays: !Ref LogRetentionDays

  FinancialsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/financials"
      RetentionInDays: !Ref LogRetentionDays

  PolicyFinancialsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy-financials"
      RetentionInDays: !Ref LogRetentionDays

  PolicyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy"
      RetentionInDays: !Ref LogRetentionDays

  PolicyPublicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy-publication"
      RetentionInDays: !Ref LogRetentionDays

  BenefitsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/benefits"
      RetentionInDays: !Ref LogRetentionDays

  ApplicationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/applications"
      RetentionInDays: !Ref LogRetentionDays

  PolicyCrawlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy-crawler"
      RetentionInDays: !Ref LogRetentionDays

  RoofRetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/roof-retention"
      RetentionInDays: !Ref LogRetentionDays

  RoofFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Resolves official Google roof data server-side and persists only explicitly confirmed results for owned properties.
        must:
          - Never log or return Google API keys.
          - Keep Cognito authorization and backend property ownership checks on every route.
    Properties:
      Handler: handlers/roof.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref RoofLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          GOOGLE_GEOCODING_API_KEY: !If
            - GeocodingConfigured
            - !Sub "{{resolve:secretsmanager:${GoogleGeocodingKeySecretArn}:SecretString:apiKey}}"
            - ""
          GOOGLE_SOLAR_API_KEY: !If
            - SolarConfigured
            - !Sub "{{resolve:secretsmanager:${GoogleSolarKeySecretArn}:SecretString:apiKey}}"
            - ""
      Policies:
        - Statement:
            - Sid: RoofTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        Geocode:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/geocode
            Method: POST
        BuildingInsights:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/building-insights
            Method: POST
        ConfirmBuilding:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/confirm-building
            Method: POST
        ConfirmRoof:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/confirm-roof
            Method: POST

  SystemsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Designs deterministic solar systems and accessory advice from an authenticated, owned roof analysis.
        must:
          - Load the confirmed analysis server-side and reject expired Google roof data.
          - Allow only table GetItem reads; no policy, price, secret or model access.
    Properties:
      Handler: handlers/systems.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref SystemsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ReadOwnedSystemAnalysis
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        RecommendSystems:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /systems/recommend
            Method: POST
        RecommendAccessories:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accessories/recommend
            Method: POST

  DesignsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves owned deterministic remaining-roof concepts and optional property-scoped inspirational imagery.
        must:
          - Compute placement from server-owned geometry and reserve solar and service access.
          - Claim each property/analysis/candidate image before a bounded model call.
          - Keep generic reusable templates separate from property-scoped image assets.
    Properties:
      Handler: handlers/designs.handler
      CodeUri: ../../apps/api/dist
      Timeout: 29
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref DesignsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          DESIGN_ASSET_BUCKET: !Ref DesignAssetBucket
          DESIGN_IMAGE_MODEL_ID: !Ref DesignImageModelId
          DESIGN_IMAGE_REGION: !Ref DesignImageRegion
      Policies:
        - Statement:
            - Sid: ReadOwnedAndStoreDesignMetadata
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: StorePrivateDesignAssets
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub "${DesignAssetBucket.Arn}/generated/*"
        - !If
          - DesignImageConfigured
          - Statement:
              - Sid: GenerateInspirationalDesignImage
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${DesignImageRegion}::foundation-model/${DesignImageModelId}"
          - !Ref AWS::NoValue
      Events:
        RecommendDesigns:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/recommend
            Method: POST
        GenerateDesign:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/generate
            Method: POST
        GetDesignTemplates:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/templates
            Method: GET
        GetDesignImage:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/{designId}/image
            Method: GET

  FinancialsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Estimates a deterministic unsubsidized 25-year cash flow for an owned roof and server-recomputed feasible system.
        must:
          - Read an owned, unexpired roof analysis and recompute the selected system server-side.
          - Never treat unverified policy benefits or export settlement as established eligibility.
          - Allow only table GetItem reads; no secrets or model access.
    Properties:
      Handler: handlers/financials.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref FinancialsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ReadOwnedFinancialAnalysis
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        EstimateFinancials:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /financials/estimate
            Method: POST

  PolicyFinancialsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Calculates a policy-adjusted upfront scenario from an owned roof and current verified benefit rules.
        must:
          - Recompute the roof-fitting system and base cash flow before applying active verified benefits.
          - Keep source citations and incomplete coverage visible; never infer benefit payment timing.
          - Read only the owned core analysis and published policy/source records.
    Properties:
      Handler: handlers/policy-financials.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref PolicyFinancialsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadOwnedPolicyFinancialRoof
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: ReadActivePolicyFinancialRules
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActivePolicyFinancialIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        EstimatePolicyFinancials:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /financials/policy-backed/estimate
            Method: POST

  PolicyPublicationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Human maker-checker publication of verified, cited policy rules from current archived official evidence.
        must:
          - Require verified ADMIN_POLICY or ADMIN Cognito membership and separate author, curator and reviewer.
          - Bind exact quote and immutable citation to pinned derived archive and current crawl state.
          - Publish only through conditional policy version and active-pointer transactions.
    Properties:
      Handler: handlers/policy-publication.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref PolicyPublicationLogGroup
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
          POLICY_DOCUMENT_BUCKET: !Ref PolicyDocumentBucket
      Policies:
        - Statement:
            - Sid: PublishVerifiedPolicyItems
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:ConditionCheckItem]
              Resource: !GetAtt PolicyTable.Arn
            - Sid: ReadPendingPublicationIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI6"
            - Sid: ReadPinnedPublicationEvidence
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub "${PolicyDocumentBucket.Arn}/derived/*"
      Events:
        CreateBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/drafts, Method: POST }
        ListBenefitReviewQueue:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/queue, Method: GET }
        BenefitDraftDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}", Method: GET }
        SubmitBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}/submit", Method: POST }
        PublishBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}/publish", Method: POST }
        RejectBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}/reject", Method: POST }

  BenefitsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Evaluates active verified benefits for an authenticated owned roof and recomputed feasible system.
        must:
          - Read only homeowner core and published policy data; never write policy or accept browser rules.
          - Fail closed on missing policy provenance or source crawl state and label incomplete coverage.
    Properties:
      Handler: handlers/benefits.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref BenefitsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadOwnedBenefitRoof
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: ReadActiveVerifiedPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActivePolicyIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        EvaluateBenefits:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /benefits/evaluate, Method: POST }

  ApplicationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Tracks a user-created application against a snapshot of selected verified policy process steps.
        must:
          - Verify current selected benefit and property ownership before creating a tracker.
          - Snapshot cited official process steps, then label all user progress and document notes as user reported.
          - Write every transition with a revision condition and an audit event; never imply official completion or deadline.
    Properties:
      Handler: handlers/applications.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref ApplicationsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadOwnedApplicationRecords
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: WriteApplicationAndAudit
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadCurrentVerifiedPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: GuardActiveApplicationPolicy
              Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActiveApplicationPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        CreateApplication:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /applications, Method: POST }
        ListApplications:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /applications, Method: GET }
        ApplicationDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}", Method: GET }
        ApplicationStepTransition:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/steps/{stepId}", Method: POST }
        ApplicationDetailsUpdate:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/details", Method: POST }
        ApplicationDocumentMetadata:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/documents", Method: POST }
        ApplicationEvents:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/events", Method: GET }
        ApplicationChatUpdate:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/chat-update", Method: POST }

  PolicyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Registers official policy sources and archives admin-uploaded immutable raw and extracted documents.
        must:
          - Require a verified Cognito ADMIN_POLICY or ADMIN group in handler code.
          - Never fetch caller URLs or publish policy facts from this ingestion path.
          - Keep this function isolated from the homeowner core table.
    Properties:
      Handler: handlers/policy.handler
      CodeUri: ../../apps/api/dist
      Architectures: [x86_64]
      Timeout: 28
      MemorySize: 1024
      LoggingConfig:
        LogGroup: !Ref PolicyLogGroup
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
          POLICY_DOCUMENT_BUCKET: !Ref PolicyDocumentBucket
      Policies:
        - Statement:
            - Sid: PolicySourceAndDocumentItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt PolicyTable.Arn
            - Sid: PolicyAdminIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub "${PolicyTable.Arn}/index/GSI1"
                - !Sub "${PolicyTable.Arn}/index/GSI4"
            - Sid: ArchivePolicyObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "${PolicyDocumentBucket.Arn}/raw/*"
                - !Sub "${PolicyDocumentBucket.Arn}/derived/*"
            - Sid: ReadPinnedPolicyReviewText
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub "${PolicyDocumentBucket.Arn}/derived/*"
      Events:
        RegisterPolicySource:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources
            Method: POST
        ListPolicySources:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources
            Method: GET
        CuratePolicySource:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources/curate
            Method: POST
        QueuePolicyCrawl:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources/crawl
            Method: POST
        PolicyReviewQueue:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/queue
            Method: GET
        PolicyCandidateDetail:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/candidates/{candidateId}
            Method: GET
        ApprovePolicyEvidence:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/candidates/{candidateId}/approve
            Method: POST
        RejectPolicyEvidence:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/candidates/{candidateId}/reject
            Method: POST
        PolicyChangeDetail:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/changes/{changeId}
            Method: GET
        ApprovePolicyChange:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/changes/{changeId}/approve
            Method: POST
        RejectPolicyChange:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/changes/{changeId}/reject
            Method: POST
        IngestPolicyDocument:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/documents
            Method: POST

  PolicyCrawlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Checks a bounded set of due curated official sources and archives only review-worthy changes.
        must:
          - Revalidate every official fetch and redirect and honor robots exclusions.
          - Preserve prior evidence and state on source fetch or extraction failure.
          - Never publish unverified extracted text as an active policy benefit.
    Properties:
      Handler: handlers/policy-crawler.handler
      CodeUri: ../../apps/api/dist
      Architectures: [x86_64]
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogGroup: !Ref PolicyCrawlerLogGroup
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
          POLICY_DOCUMENT_BUCKET: !Ref PolicyDocumentBucket
      Policies:
        - Statement:
            - Sid: PolicyCrawlerItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt PolicyTable.Arn
            - Sid: ReadDueSourcesIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI2"
            - Sid: ReadApprovedClaimIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI3"
            - Sid: ArchiveCrawledPolicyObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "${PolicyDocumentBucket.Arn}/raw/*"
                - !Sub "${PolicyDocumentBucket.Arn}/derived/*"
            - Sid: ReadPinnedDerivedPolicyVersion
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub "${PolicyDocumentBucket.Arn}/derived/*"
      Events:
        DuePolicySourceSweep:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Review a bounded set of due curated official policy sources.

  PolicyCrawlerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled official policy crawler failed or exceeded its bounded due-source batch.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PolicyCrawlerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RoofRetentionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Hard-deletes expired Google-derived roof records through a sparse expiry index before the Google 30-day retention limit.
        must:
          - Only query GSI3 and conditionally delete expired ROOF_PREVIEW, SOLAR_ANALYSIS and SOLAR_CACHE items.
          - Fail on bounded-sweep backlog so the CloudWatch alarm is actionable.
    Properties:
      Handler: handlers/retention.handler
      CodeUri: ../../apps/api/dist
      Timeout: 360
      LoggingConfig:
        LogGroup: !Ref RoofRetentionLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ReadExpiredGoogleRoofIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${AnalysesTable.Arn}/index/GSI3"
            - Sid: DeleteExpiredGoogleRoofItems
              Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        HourlyRetentionSweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Remove expired Google-derived roof records before their 30-day retention limit.

  RoofRetentionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Google roof hard-delete worker failed or exceeded its bounded sweep.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RoofRetentionFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CoreFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves authenticated account, customer, property and lead operations through the shared core table.
        must:
          - Keep the Cognito authorizer on every core route and enforce ownership in backend code.
          - Grant access only to the core table and its two property lookup indexes.
    Properties:
      Handler: handlers/core.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref CoreLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: CoreTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
                - dynamodb:Query
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: CorePropertyIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub "${AnalysesTable.Arn}/index/GSI1"
                - !Sub "${AnalysesTable.Arn}/index/GSI2"
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/me
            Method: GET
        BootstrapUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/bootstrap
            Method: POST
        GetOrganization:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /organizations/me
            Method: GET
        ListCustomers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /customers
            Method: GET
        CreateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /customers
            Method: POST
        ListProperties:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties
            Method: GET
        CreateProperty:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties
            Method: POST
        GetProperty:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}
            Method: GET
        ListPropertyAnalyses:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}/analyses
            Method: GET
        ListLeads:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /leads
            Method: GET
        CreateLead:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /leads
            Method: POST

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/profile.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref ProfileLogGroup
      Events:
        CurrentIdentity:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /me
            Method: GET

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/health.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref HealthLogGroup
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/analyze.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref AnalyzeLogGroup
      Events:
        Analyze:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/analyze
            Method: POST
        LegacyAnalyze:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /analyze
            Method: POST

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides read-only owner-scoped advice from deterministic calculations and current cited policy facts.
        must:
          - Never send raw address, application reference, vendor or archived document text to Bedrock.
          - Let Bedrock select fact IDs only; render claims and citations from trusted server facts.
          - Keep Bedrock optional and scope invocation to the configured model ARN.
    Properties:
      Handler: handlers/chat.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref ChatLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          BEDROCK_MODEL_ID: !Ref AdvisorBedrockModelId
          BEDROCK_REGION: !Ref AdvisorBedrockRegion
      Policies:
        - Statement:
            - Sid: ReadOwnedAdvisorContext
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadCurrentAdvisorPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActiveAdvisorPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
        - !If
          - AdvisorBedrockConfigured
          - Statement:
              - Sid: SelectAdvisorFactCards
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If
                  - AdvisorFoundationModelConfigured
                  - [!Ref AdvisorBedrockModelArn, !Ref AdvisorBedrockFoundationModelArn]
                  - !Ref AdvisorBedrockModelArn
          - !Ref AWS::NoValue
      Events:
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /advisor/solar
            Method: POST
        LegacyChat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chat
            Method: POST

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: organizationId
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "128"
      UserPoolTags:
        Project: SolarSaathi
        Environment: !Ref Environment

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleFederationEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleOAuthClientId
        client_secret: !Sub "{{resolve:secretsmanager:${GoogleOAuthSecretArn}:SecretString:clientSecret}}"
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      CallbackURLs:
        - !Sub "${ApplicationOrigin}/auth/callback"
      LogoutURLs:
        - !Sub "${ApplicationOrigin}/auth/sign-in"
      SupportedIdentityProviders: !If
        - GoogleFederationEnabled
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      ReadAttributes: [email, email_verified, name, "custom:organizationId"]
      WriteAttributes: [email, name]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  HomeownerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: HOMEOWNER
      Description: Homeowner identity; property ownership is enforced separately by backend APIs.

  BrokerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: BROKER
      Description: Administrator-assigned broker membership; organization ownership is enforced separately.

  PolicyAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ADMIN_POLICY
      Description: Privileged policy source and document administration; membership is assigned out of band.

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ADMIN
      Description: Privileged platform administration; membership is assigned out of band.

  PolicyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: N
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
        - AttributeName: GSI4PK
          AttributeType: S
        - AttributeName: GSI4SK
          AttributeType: S
        - AttributeName: GSI5PK
          AttributeType: S
        - AttributeName: GSI5SK
          AttributeType: S
        - AttributeName: GSI6PK
          AttributeType: S
        - AttributeName: GSI6SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI4
          KeySchema:
            - AttributeName: GSI4PK
              KeyType: HASH
            - AttributeName: GSI4SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI5
          KeySchema:
            - AttributeName: GSI5PK
              KeyType: HASH
            - AttributeName: GSI5SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI6
          KeySchema:
            - AttributeName: GSI6PK
              KeyType: HASH
            - AttributeName: GSI6SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

  PolicyDocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

  DesignAssetBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInspirationalImages
            Status: Enabled
            Prefix: generated/
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref ApplicationOrigin]
            AllowedMethods: [GET]
            AllowedHeaders: ["*"]
            MaxAge: 300
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

  DesignAssetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DesignAssetBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DesignAssetBucket.Arn
              - !Sub "${DesignAssetBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  PolicyDocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PolicyDocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PolicyDocumentBucket.Arn
              - !Sub "${PolicyDocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyUnconditionalPolicyObjectWrites
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              - !Sub "${PolicyDocumentBucket.Arn}/raw/*"
              - !Sub "${PolicyDocumentBucket.Arn}/derived/*"
            Condition:
              "Null":
                "s3:if-none-match": "true"
              Bool:
                s3:ObjectCreationOperation: "true"

  AnalysesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores the versioned core entities in one encrypted table; owner and organization indexes support scoped property listings.
        must:
          - Retain data on stack deletion or replacement.
          - GSI1 and GSI2 must project full property records for repository validation.
          - The expiry attribute must match the SOLAR_CACHE schema; application code still checks expiry before reads.
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAtEpochSeconds
        Enabled: true
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ApiUrl:
    Description: API base URL; roof and advisor endpoints remain unavailable.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1"
  AnalysesTableName:
    Description: Private core entity table used by the authenticated core API.
    Value: !Ref AnalysesTable
  PolicyTableName:
    Description: Private isolated registry and immutable policy-document metadata table.
    Value: !Ref PolicyTable
  PolicyDocumentBucketName:
    Description: Private versioned raw and extracted policy-document archive.
    Value: !Ref PolicyDocumentBucket
  DesignAssetBucketName:
    Description: Private short-lived inspirational design image bucket.
    Value: !Ref DesignAssetBucket
  CognitoUserPoolId:
    Description: Public user pool identifier for frontend configuration.
    Value: !Ref UserPool
  CognitoClientId:
    Description: Public app client identifier; no client secret is generated.
    Value: !Ref UserPoolClient
  CognitoDomainHost:
    Description: Public managed-login hostname, without scheme or path.
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  CognitoRedirectSignIn:
    Description: Exact registered application callback URL.
    Value: !Sub "${ApplicationOrigin}/auth/callback"
  CognitoRedirectSignOut:
    Description: Exact registered application sign-out URL.
    Value: !Sub "${ApplicationOrigin}/auth/sign-in"
