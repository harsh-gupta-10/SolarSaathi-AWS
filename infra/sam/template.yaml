AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SolarSaathi authenticated roof, planning, policy evidence and grounded advisor APIs with scheduled official-source review.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: README.md
        has: Phase 0 resource intent, logging and deployment constraints

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  EnableCrawlerReservedConcurrency:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Reserve one crawler execution only in accounts with a Lambda concurrency quota above the ten-execution unreserved minimum.
  ApplicationOrigin:
    Type: String
    Default: https://app.solarsaathi.in
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]+)?$|^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    Description: Exact application origin, no trailing slash; localhost HTTP is for development only.
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    Description: Globally unique Cognito login prefix; choose explicitly before deployment.
  EnableGoogleFederation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  GoogleOAuthClientId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$'
    Description: Google OAuth web client ID, required only when federation is enabled.
  GoogleOAuthSecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing a clientSecret JSON key; never a plaintext secret.
  GoogleGeocodingKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing an apiKey JSON key for server-side Geocoding requests.
  GoogleSolarKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN containing an apiKey JSON key for server-side Solar requests.
  BraveSearchKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Optional Secrets Manager ARN containing an apiKey JSON key for transient official-host discovery only.
  ChatProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, openai]
    Description: Model provider for the streaming chat assistant. openai is an external provider (chat text leaves AWS); bedrock is the default.
  OpenAiChatModelId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9._:-]{1,100}$'
    Description: OpenAI model ID for chat when ChatProvider is openai. Check it with the OpenAI models list; a wrong ID answers 404.
  ChatModelRequestFields:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\{.{0,500}\}$'
    Description: Optional JSON object merged into every chat model request (for example {"reasoning_effort":"none"} for OpenAI reasoning models that must use function tools).
  OpenAiApiKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN of a secret with an apiKey JSON key for OpenAI. Read at request time by the chat function only; never placed in its environment.
  AdvisorBedrockModelId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^\S{1,2048}$'
    Description: Optional Bedrock model ID or ARN for fact-card selection; blank uses deterministic fallback.
  AdvisorBedrockModelArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):bedrock:[a-z0-9-]+:([0-9]{12})?:(foundation-model|inference-profile|application-inference-profile)/.+$'
    Description: Exact IAM resource ARN for the configured advisor model or inference profile.
  AdvisorBedrockFoundationModelArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:(aws|aws-cn|aws-us-gov):bedrock:[a-z0-9*_-]+::foundation-model/[A-Za-z0-9._:-]+$'
    Description: For an advisor inference profile, also grant its routed foundation model ARN, using wildcard region when required.
  AdvisorBedrockRegion:
    Type: String
    Default: ap-south-1
    AllowedPattern: '^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]+$'
    Description: Region used for optional Bedrock fact-card selection.
  GuardrailId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-z0-9]{10,64}$'
    Description: Optional existing Bedrock guardrail ID. Blank creates and uses the stack-managed ChatGuardrail.
  GuardrailVersion:
    Type: String
    Default: ""
    AllowedPattern: '^$|^([0-9]{1,8}|DRAFT)$'
    Description: Version for an external GuardrailId; required when GuardrailId is set, ignored otherwise.
  DesignImageModelId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^amazon\.nova-canvas-v[0-9]+:[0-9]+$'
    Description: Optional Nova Canvas image model; blank keeps deterministic template and 3D concepts.
  DesignImageRegion:
    Type: String
    Default: ap-south-1
    AllowedPattern: '^[a-z]{2}(-gov)?-[a-z0-9-]+-[0-9]+$'
    Description: Region for optional Nova Canvas image generation.

Conditions:
  CrawlerConcurrencyReserved: !Equals [!Ref EnableCrawlerReservedConcurrency, "true"]
  GoogleFederationEnabled: !Equals [!Ref EnableGoogleFederation, "true"]
  GeocodingConfigured: !Not [!Equals [!Ref GoogleGeocodingKeySecretArn, ""]]
  SolarConfigured: !Not [!Equals [!Ref GoogleSolarKeySecretArn, ""]]
  BraveSearchConfigured: !Not [!Equals [!Ref BraveSearchKeySecretArn, ""]]
  OpenAiChatConfigured: !And
    - !Equals [!Ref ChatProvider, "openai"]
    - !Not [!Equals [!Ref OpenAiApiKeySecretArn, ""]]
  AdvisorBedrockConfigured: !Not [!Equals [!Ref AdvisorBedrockModelArn, ""]]
  AdvisorFoundationModelConfigured: !Not [!Equals [!Ref AdvisorBedrockFoundationModelArn, ""]]
  ExternalGuardrail: !Not [!Equals [!Ref GuardrailId, ""]]
  ManagedGuardrail: !Equals [!Ref GuardrailId, ""]
  DesignImageConfigured: !Not [!Equals [!Ref DesignImageModelId, ""]]

Rules:
  GoogleConfigurationRequired:
    RuleCondition: !Equals [!Ref EnableGoogleFederation, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoogleOAuthClientId, ""]]
        AssertDescription: Google federation requires an OAuth client ID.
      - Assert: !Not [!Equals [!Ref GoogleOAuthSecretArn, ""]]
        AssertDescription: Google federation requires a Secrets Manager ARN.
  ExternalGuardrailNeedsVersion:
    RuleCondition: !Not [!Equals [!Ref GuardrailId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref GuardrailVersion, ""]]
        AssertDescription: An external GuardrailId requires GuardrailVersion.
  OpenAiChatNeedsModelAndSecret:
    RuleCondition: !Equals [!Ref ChatProvider, "openai"]
    Assertions:
      - Assert: !Not [!Equals [!Ref OpenAiChatModelId, ""]]
        AssertDescription: ChatProvider openai requires OpenAiChatModelId.
      - Assert: !Not [!Equals [!Ref OpenAiApiKeySecretArn, ""]]
        AssertDescription: ChatProvider openai requires OpenAiApiKeySecretArn.
  AdvisorModelConfigurationPaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref AdvisorBedrockModelId, ""]
            - !Equals [!Ref AdvisorBedrockModelArn, ""]
          - !And
            - !Not [!Equals [!Ref AdvisorBedrockModelId, ""]]
            - !Not [!Equals [!Ref AdvisorBedrockModelArn, ""]]
        AssertDescription: Advisor Bedrock model ID and exact IAM resource ARN must both be set or both blank.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        API_ALLOWED_ORIGIN: !Ref ApplicationOrigin
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        COGNITO_REGION: !Ref AWS::Region
    Tags:
      Project: SolarSaathi
      Environment: !Ref Environment

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${ApplicationOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,Idempotency-Key'"
        AllowMethods: "'GET,POST,PUT,DELETE,PATCH,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${ApplicationOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"
          ResponseTemplates:
            application/json: '{"error":{"code":"GATEWAY_REQUEST_ERROR","message":"Check your sign-in session and request.","requestId":"$context.requestId"}}'
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${ApplicationOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"
          ResponseTemplates:
            application/json: '{"error":{"code":"GATEWAY_SERVICE_ERROR","message":"The service is unavailable. Try again later.","requestId":"$context.requestId"}}'
      Auth:
        DefaultAuthorizer: CognitoUserPool
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoUserPool:
            UserPoolArn: !GetAtt UserPool.Arn
            AuthorizationScopes:
              - aws.cognito.signin.user.admin
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/health"
      RetentionInDays: !Ref LogRetentionDays

  AnalyzeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/analyze"
      RetentionInDays: !Ref LogRetentionDays

  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/advisor"
      RetentionInDays: !Ref LogRetentionDays

  ChatAgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/chat-agent"
      RetentionInDays: !Ref LogRetentionDays

  ChatsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/chats"
      RetentionInDays: !Ref LogRetentionDays

  PriceAdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/price-admin"
      RetentionInDays: !Ref LogRetentionDays

  ProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/identity"
      RetentionInDays: !Ref LogRetentionDays

  CoreLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/core"
      RetentionInDays: !Ref LogRetentionDays

  RoofLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/roof"
      RetentionInDays: !Ref LogRetentionDays

  SystemsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/systems"
      RetentionInDays: !Ref LogRetentionDays

  DesignsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/designs"
      RetentionInDays: !Ref LogRetentionDays

  FinancialsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/financials"
      RetentionInDays: !Ref LogRetentionDays

  PolicyFinancialsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy-financials"
      RetentionInDays: !Ref LogRetentionDays

  InternationalResearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/international-research"
      RetentionInDays: !Ref LogRetentionDays

  BrokerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/broker"
      RetentionInDays: !Ref LogRetentionDays

  PolicyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy"
      RetentionInDays: !Ref LogRetentionDays

  PolicyPublicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy-publication"
      RetentionInDays: !Ref LogRetentionDays

  BenefitsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/benefits"
      RetentionInDays: !Ref LogRetentionDays

  ApplicationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/applications"
      RetentionInDays: !Ref LogRetentionDays

  PolicyCrawlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/policy-crawler"
      RetentionInDays: !Ref LogRetentionDays

  RoofRetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/solarsaathi/${AWS::StackName}/${Environment}/roof-retention"
      RetentionInDays: !Ref LogRetentionDays

  RoofFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Resolves official Google roof data server-side and persists only explicitly confirmed results for owned properties.
        must:
          - Never log or return Google API keys.
          - Keep Cognito authorization and backend property ownership checks on every route.
    Properties:
      Handler: handlers/roof.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref RoofLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          GOOGLE_GEOCODING_API_KEY: !If
            - GeocodingConfigured
            - !Sub "{{resolve:secretsmanager:${GoogleGeocodingKeySecretArn}:SecretString:apiKey}}"
            - ""
          GOOGLE_SOLAR_API_KEY: !If
            - SolarConfigured
            - !Sub "{{resolve:secretsmanager:${GoogleSolarKeySecretArn}:SecretString:apiKey}}"
            - ""
      Policies:
        - Statement:
            - Sid: RoofTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        Geocode:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/geocode
            Method: POST
        BuildingInsights:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/building-insights
            Method: POST
        ConfirmBuilding:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/confirm-building
            Method: POST
        ConfirmRoof:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /solar/confirm-roof
            Method: POST

  SystemsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Designs deterministic solar systems and accessory advice from an authenticated, owned roof analysis.
        must:
          - Load the confirmed analysis server-side and reject expired Google roof data.
          - Allow only table GetItem reads; no policy, price, secret or model access.
    Properties:
      Handler: handlers/systems.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref SystemsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ReadOwnedSystemAnalysis
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        RecommendSystems:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /systems/recommend
            Method: POST
        RecommendAccessories:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /accessories/recommend
            Method: POST

  DesignsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves owned deterministic remaining-roof concepts and optional property-scoped inspirational imagery.
        must:
          - Compute placement from server-owned geometry and reserve solar and service access.
          - Claim each property/analysis/candidate image before a bounded model call.
          - Keep generic reusable templates separate from property-scoped image assets.
    Properties:
      Handler: handlers/designs.handler
      CodeUri: ../../apps/api/dist
      Timeout: 29
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref DesignsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          DESIGN_ASSET_BUCKET: !Ref DesignAssetBucket
          DESIGN_IMAGE_MODEL_ID: !Ref DesignImageModelId
          DESIGN_IMAGE_REGION: !Ref DesignImageRegion
      Policies:
        - Statement:
            - Sid: ReadOwnedAndStoreDesignMetadata
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: StorePrivateDesignAssets
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub "${DesignAssetBucket.Arn}/generated/*"
        - !If
          - DesignImageConfigured
          - Statement:
              - Sid: GenerateInspirationalDesignImage
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${DesignImageRegion}::foundation-model/${DesignImageModelId}"
          - !Ref AWS::NoValue
      Events:
        RecommendDesigns:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/recommend
            Method: POST
        GenerateDesign:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/generate
            Method: POST
        GetDesignTemplates:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/templates
            Method: GET
        GetDesignImage:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /designs/{designId}/image
            Method: GET

  FinancialsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Estimates a deterministic unsubsidized 25-year cash flow for an owned roof and server-recomputed feasible system.
        must:
          - Read an owned, unexpired roof analysis and recompute the selected system server-side.
          - Never treat unverified policy benefits or export settlement as established eligibility.
          - Allow only table GetItem reads; no secrets or model access.
    Properties:
      Handler: handlers/financials.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref FinancialsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ReadOwnedFinancialAnalysis
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        EstimateFinancials:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /financials/estimate
            Method: POST

  PolicyFinancialsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Calculates a policy-adjusted upfront scenario from an owned roof and current verified benefit rules.
        must:
          - Recompute the roof-fitting system and base cash flow before applying active verified benefits.
          - Keep source citations and incomplete coverage visible; never infer benefit payment timing.
          - Read only the owned core analysis and published policy/source records.
    Properties:
      Handler: handlers/policy-financials.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref PolicyFinancialsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadOwnedPolicyFinancialRoof
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: ReadActivePolicyFinancialRules
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActivePolicyFinancialIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        EstimatePolicyFinancials:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /financials/policy-backed/estimate
            Method: POST

  InternationalResearchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Fetches bounded official international policy source metadata on demand without activating or calculating benefits.
        must:
          - Reverse geocode user-triggered coordinates with SingleUse and never persist coordinates or geocode responses.
          - Fetch only reviewed official hosts after public DNS, pinned TLS, robots, content and time checks.
          - Never pass user context to external discovery or expose the server search key.
    Properties:
      Handler: handlers/international-research.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref InternationalResearchLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          BRAVE_SEARCH_API_KEY: !If
            - BraveSearchConfigured
            - !Sub "{{resolve:secretsmanager:${BraveSearchKeySecretArn}:SecretString:apiKey}}"
            - ""
      Policies:
        - Statement:
            - Sid: ReverseGeocodeSingleUse
              Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
            - Sid: ReadResearchCache
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["INTL_RESEARCH#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: WriteResearchCache
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["INTL_RESEARCH#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
      Events:
        ResearchInternationalPolicies:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /policies/research
            Method: POST

  BrokerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves broker-only, org-scoped immutable proposal snapshots and property design records.
        must:
          - Recheck current broker membership and customer, property and analysis binding server-side.
          - Recompute policy financial results and condition-check all source record revisions before a proposal write.
          - Never store applicant fact input, raw address, document PDF or presigned design image URL.
    Properties:
      Handler: handlers/broker.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref BrokerLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadBrokerRecords
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: GuardBrokerProposalScope
              Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: SaveImmutableBrokerProposal
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["CUSTOMER#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: UpdateBrokerLeadAndAudit
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["ORG#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadBrokerVerifiedPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListBrokerVerifiedPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        PreviewBrokerProposal:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /broker/proposals/preview, Method: POST }
        SaveBrokerProposal:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/broker/customers/{customerId}/proposals", Method: POST }
        ListBrokerProposals:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/broker/customers/{customerId}/proposals", Method: GET }
        GetBrokerProposal:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/broker/customers/{customerId}/proposals/{proposalId}", Method: GET }
        ListBrokerPropertyDesigns:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/broker/properties/{propertyId}/designs", Method: GET }
        UpdateBrokerLead:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/broker/leads/{leadId}", Method: PATCH }

  PolicyPublicationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Human maker-checker publication of verified, cited policy rules from current archived official evidence.
        must:
          - Require verified ADMIN_POLICY or ADMIN Cognito membership and separate author, curator and reviewer.
          - Bind exact quote and immutable citation to pinned derived archive and current crawl state.
          - Publish only through conditional policy version and active-pointer transactions.
    Properties:
      Handler: handlers/policy-publication.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref PolicyPublicationLogGroup
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
          POLICY_DOCUMENT_BUCKET: !Ref PolicyDocumentBucket
      Policies:
        - Statement:
            - Sid: PublishVerifiedPolicyItems
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:ConditionCheckItem]
              Resource: !GetAtt PolicyTable.Arn
            - Sid: ReadPendingPublicationIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI6"
            - Sid: ReadActivePublicationIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
            - Sid: ReadPinnedPublicationEvidence
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub "${PolicyDocumentBucket.Arn}/derived/*"
      Events:
        CreateBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/drafts, Method: POST }
        ListBenefitReviewQueue:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/queue, Method: GET }
        BenefitDraftDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}", Method: GET }
        SubmitBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}/submit", Method: POST }
        PublishBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}/publish", Method: POST }
        RejectBenefitDraft:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/{draftId}/reject", Method: POST }
        ListActiveBenefitPolicies:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/active, Method: GET }
        ListBenefitVersions:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/versions/{policyId}", Method: GET }
        BenefitVersionDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/versions/{policyId}/{version}", Method: GET }
        ProposeBenefitRollback:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/rollbacks, Method: POST }
        ListBenefitRollbackQueue:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/policy/benefits/rollbacks/queue, Method: GET }
        BenefitRollbackDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/rollbacks/{rollbackId}", Method: GET }
        ApproveBenefitRollback:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/rollbacks/{rollbackId}/approve", Method: POST }
        RejectBenefitRollback:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/policy/benefits/rollbacks/{rollbackId}/reject", Method: POST }

  BenefitsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Evaluates active verified benefits for an authenticated owned roof and recomputed feasible system.
        must:
          - Read only homeowner core and published policy data; never write policy or accept browser rules.
          - Fail closed on missing policy provenance or source crawl state and label incomplete coverage.
    Properties:
      Handler: handlers/benefits.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref BenefitsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadOwnedBenefitRoof
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: ReadActiveVerifiedPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActivePolicyIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        EvaluateBenefits:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /benefits/evaluate, Method: POST }

  ApplicationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Tracks a user-created application against a snapshot of selected verified policy process steps.
        must:
          - Verify current selected benefit and property ownership before creating a tracker.
          - Snapshot cited official process steps, then label all user progress and document notes as user reported.
          - Write every transition with a revision condition and an audit event; never imply official completion or deadline.
    Properties:
      Handler: handlers/applications.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref ApplicationsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          APPLICATION_DOCUMENT_BUCKET: !Ref ApplicationDocumentBucket
      Policies:
        - Statement:
            - Sid: ReadOwnedApplicationRecords
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: WriteApplicationAndAudit
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: GuardApplicationWriteScope
              Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ApplicationIdempotencyKeys
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["IDEMPOTENCY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadCurrentVerifiedPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: GuardActiveApplicationPolicy
              Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActiveApplicationPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
            # Presigned upload/download URLs act with these permissions; keys are server-built under applications/.
            - Sid: ApplicationDocumentObjects
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub "${ApplicationDocumentBucket.Arn}/applications/*"
            # Lets HeadObject report a missing upload as 404 instead of 403.
            - Sid: ApplicationDocumentMissingObjectCheck
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ApplicationDocumentBucket.Arn
              Condition:
                StringLike:
                  "s3:prefix": ["applications/*"]
      Events:
        CreateApplication:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /applications, Method: POST }
        ListApplications:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /applications, Method: GET }
        ApplicationDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}", Method: GET }
        ApplicationStepTransition:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/steps/{stepId}", Method: POST }
        ApplicationDetailsUpdate:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/details", Method: POST }
        ApplicationDocumentMetadata:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/documents", Method: POST }
        ApplicationEvents:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/events", Method: GET }
        ApplicationChatUpdate:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/chat-update", Method: POST }
        ApplicationDocumentConfirm:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/documents/{documentId}/confirm", Method: POST }
        ApplicationDocumentDownload:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/documents/{documentId}/download", Method: GET }
        ApplicationDocumentDelete:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/applications/{applicationId}/documents/{documentId}", Method: DELETE }

  PolicyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Registers official policy sources and archives admin-uploaded immutable raw and extracted documents.
        must:
          - Require a verified Cognito ADMIN_POLICY or ADMIN group in handler code.
          - Never fetch caller URLs or publish policy facts from this ingestion path.
          - Keep this function isolated from the homeowner core table.
    Properties:
      Handler: handlers/policy.handler
      CodeUri: ../../apps/api/dist
      Architectures: [x86_64]
      Timeout: 28
      MemorySize: 1024
      LoggingConfig:
        LogGroup: !Ref PolicyLogGroup
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
          POLICY_DOCUMENT_BUCKET: !Ref PolicyDocumentBucket
      Policies:
        - Statement:
            - Sid: PolicySourceAndDocumentItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt PolicyTable.Arn
            - Sid: PolicyAdminIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub "${PolicyTable.Arn}/index/GSI1"
                - !Sub "${PolicyTable.Arn}/index/GSI4"
            - Sid: ArchivePolicyObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "${PolicyDocumentBucket.Arn}/raw/*"
                - !Sub "${PolicyDocumentBucket.Arn}/derived/*"
            - Sid: ReadPinnedPolicyReviewText
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub "${PolicyDocumentBucket.Arn}/derived/*"
      Events:
        RegisterPolicySource:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources
            Method: POST
        ListPolicySources:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources
            Method: GET
        CuratePolicySource:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources/curate
            Method: POST
        QueuePolicyCrawl:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/sources/crawl
            Method: POST
        PolicyReviewQueue:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/queue
            Method: GET
        PolicyCrawlerRuns:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/crawler-runs
            Method: GET
        PolicyEvidenceConflicts:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/conflicts
            Method: GET
        PolicyCandidateDetail:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/candidates/{candidateId}
            Method: GET
        ApprovePolicyEvidence:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/candidates/{candidateId}/approve
            Method: POST
        RejectPolicyEvidence:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/candidates/{candidateId}/reject
            Method: POST
        PolicyChangeDetail:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/changes/{changeId}
            Method: GET
        ApprovePolicyChange:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/changes/{changeId}/approve
            Method: POST
        RejectPolicyChange:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/changes/{changeId}/reject
            Method: POST
        IngestPolicyDocument:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /admin/policy/documents
            Method: POST

  PolicyCrawlerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Checks a bounded set of due curated official sources and archives only review-worthy changes.
        must:
          - Revalidate every official fetch and redirect and honor robots exclusions.
          - Preserve prior evidence and state on source fetch or extraction failure.
          - Never publish unverified extracted text as an active policy benefit.
    Properties:
      Handler: handlers/policy-crawler.handler
      CodeUri: ../../apps/api/dist
      Architectures: [x86_64]
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: !If [CrawlerConcurrencyReserved, 1, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref PolicyCrawlerLogGroup
      Environment:
        Variables:
          POLICY_TABLE_NAME: !Ref PolicyTable
          POLICY_DOCUMENT_BUCKET: !Ref PolicyDocumentBucket
      Policies:
        - Statement:
            - Sid: PolicyCrawlerItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt PolicyTable.Arn
            - Sid: ReadDueSourcesIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI2"
            - Sid: ReadApprovedClaimIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI3"
            - Sid: ArchiveCrawledPolicyObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "${PolicyDocumentBucket.Arn}/raw/*"
                - !Sub "${PolicyDocumentBucket.Arn}/derived/*"
            - Sid: ReadPinnedDerivedPolicyVersion
              Effect: Allow
              Action: s3:GetObjectVersion
              Resource: !Sub "${PolicyDocumentBucket.Arn}/derived/*"
      Events:
        DuePolicySourceSweep:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Review a bounded set of due curated official policy sources.

  PolicyCrawlerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled official policy crawler failed or exceeded its bounded due-source batch.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PolicyCrawlerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RoofRetentionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Hard-deletes expired Google-derived roof records through a sparse expiry index before the Google 30-day retention limit.
        must:
          - Only query GSI3 and conditionally delete expired ROOF_PREVIEW, SOLAR_ANALYSIS and SOLAR_CACHE items.
          - Fail on bounded-sweep backlog so the CloudWatch alarm is actionable.
    Properties:
      Handler: handlers/retention.handler
      CodeUri: ../../apps/api/dist
      Timeout: 360
      LoggingConfig:
        LogGroup: !Ref RoofRetentionLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ReadExpiredGoogleRoofIndex
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${AnalysesTable.Arn}/index/GSI3"
            - Sid: DeleteExpiredGoogleRoofItems
              Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt AnalysesTable.Arn
      Events:
        HourlyRetentionSweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Remove expired Google-derived roof records before their 30-day retention limit.

  RoofRetentionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Google roof hard-delete worker failed or exceeded its bounded sweep.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RoofRetentionFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CoreFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Serves authenticated account, customer, property and lead operations through the shared core table, including owner-checked property deletion.
        must:
          - Keep the Cognito authorizer on every core route and enforce ownership in backend code.
          - Grant access only to the core table and its two property lookup indexes, plus delete-only access to application documents for property deletion.
    Properties:
      Handler: handlers/core.handler
      CodeUri: ../../apps/api/dist
      LoggingConfig:
        LogGroup: !Ref CoreLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          APPLICATION_DOCUMENT_BUCKET: !Ref ApplicationDocumentBucket
      Policies:
        - Statement:
            # Property deletion also deletes the property's uploaded application files. Delete only, documents prefix only.
            - Sid: CorePropertyDocumentPurge
              Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "${ApplicationDocumentBucket.Arn}/applications/*"
            - Sid: CoreTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:Query
              Resource: !GetAtt AnalysesTable.Arn
            - Sid: CoreIdempotencyUpdates
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["IDEMPOTENCY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: CorePropertyIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub "${AnalysesTable.Arn}/index/GSI1"
                - !Sub "${AnalysesTable.Arn}/index/GSI2"
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/me
            Method: GET
        BootstrapUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/bootstrap
            Method: POST
        GetOrganization:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /organizations/me
            Method: GET
        ListCustomers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /customers
            Method: GET
        CreateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /customers
            Method: POST
        ListProperties:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties
            Method: GET
        CreateProperty:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties
            Method: POST
        GetProperty:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}
            Method: GET
        DeleteProperty:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}
            Method: DELETE
        ListPropertyAnalyses:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}/analyses
            Method: GET
        GetPropertyAnalysis:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}/analyses/{analysisId}
            Method: GET
        GetAnalysisDraft:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}/analyses/{analysisId}/draft
            Method: GET
        SaveAnalysisDraft:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /properties/{propertyId}/analyses/{analysisId}/draft
            Method: PUT
        ListLeads:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /leads
            Method: GET
        CreateLead:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /leads
            Method: POST

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/profile.handler
