  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides read-only owner-scoped advice from deterministic calculations and current cited policy facts.
        must:
          - Never send raw address, application reference, vendor or archived document text to Bedrock.
          - Let Bedrock select fact IDs only; render claims and citations from trusted server facts.
          - Keep Bedrock optional and scope invocation to the configured model ARN.
    Properties:
      Handler: handlers/chat.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref ChatLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          BEDROCK_MODEL_ID: !Ref AdvisorBedrockModelId
          BEDROCK_REGION: !Ref AdvisorBedrockRegion
      Policies:
        - Statement:
            - Sid: ReadOwnedAdvisorContext
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadCurrentAdvisorPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActiveAdvisorPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
        - !If
          - AdvisorBedrockConfigured
          - Statement:
              - Sid: SelectAdvisorFactCards
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If
                  - AdvisorFoundationModelConfigured
                  - [!Ref AdvisorBedrockModelArn, !Ref AdvisorBedrockFoundationModelArn]
                  - !Ref AdvisorBedrockModelArn
          - !Ref AWS::NoValue
      Events:
        Chat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /advisor/solar
            Method: POST
        LegacyChat:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /chat
            Method: POST

  ChatAgentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Streams a signed-in user's solar assistant turn over a Lambda Function URL, calling deterministic services in-process with the verified identity.
        must:
          - Verify the Cognito access token in code on every request; the Function URL itself has no IAM auth.
          - Limit CORS to the application origin.
          - Grant Bedrock invoke and guardrail access only to the configured model, inference profile and guardrail.
          - When ChatProvider is openai, grant read access to exactly one Secrets Manager secret and keep the key out of the function environment.
          - Never log message text, prompts, tool results or model output.
          - Write only chat state, price research candidates and counters; never policy or account records.
    Properties:
      Handler: handlers/chat-stream.handler
      CodeUri: ../../apps/api/dist
      Timeout: 120
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref ChatAgentLogGroup
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins: [!Ref ApplicationOrigin]
          AllowMethods: [POST]
          AllowHeaders: [content-type, authorization]
          MaxAge: 600
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          BEDROCK_MODEL_ID: !Ref AdvisorBedrockModelId
          BEDROCK_REGION: !Ref AdvisorBedrockRegion
          CHAT_PROVIDER: !Ref ChatProvider
          OPENAI_CHAT_MODEL_ID: !Ref OpenAiChatModelId
          CHAT_MODEL_REQUEST_FIELDS: !Ref ChatModelRequestFields
          OPENAI_API_KEY_SECRET_ARN: !Ref OpenAiApiKeySecretArn
          GUARDRAIL_ID: !If [ExternalGuardrail, !Ref GuardrailId, !GetAtt ChatGuardrail.GuardrailId]
          GUARDRAIL_VERSION: !If [ExternalGuardrail, !Ref GuardrailVersion, !GetAtt ChatGuardrailVersion.Version]
          BRAVE_SEARCH_API_KEY: !If
            - BraveSearchConfigured
            - !Sub "{{resolve:secretsmanager:${BraveSearchKeySecretArn}:SecretString:apiKey}}"
            - ""
      Policies:
        - Statement:
            - Sid: ReadChatContext
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*", "CHAT#*", "PRICE_BENCHMARK#*", "PRICE_STATUS#APPROVED"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadPropertyIndexes
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub "${AnalysesTable.Arn}/index/GSI1"
                - !Sub "${AnalysesTable.Arn}/index/GSI2"
            - Sid: WriteChatStateAndPriceCandidates
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["CHAT#*", "PRICE_BENCHMARK#*", "PRICE_STATUS#CANDIDATE"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadCurrentChatPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActiveChatPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
            - Sid: ApplyChatGuardrail
              Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !If
                - ExternalGuardrail
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}"
                - !GetAtt ChatGuardrail.GuardrailArn
        - !If
          - AdvisorBedrockConfigured
          - Statement:
              - Sid: StreamChatModel
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: !If
                  - AdvisorFoundationModelConfigured
                  - [!Ref AdvisorBedrockModelArn, !Ref AdvisorBedrockFoundationModelArn]
                  - !Ref AdvisorBedrockModelArn
          - !Ref AWS::NoValue
        - !If
          - OpenAiChatConfigured
          - Statement:
              # Exactly one secret, read-only. The key is fetched at request time and never placed in the function environment.
              - Sid: ReadOpenAiApiKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OpenAiApiKeySecretArn
          - !Ref AWS::NoValue

  ChatAgentFunctionUrlInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ChatAgentFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ChatsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Lists, reads and deletes the signed-in user's conversations and executes a confirmed single-use assistant proposal through the existing services.
        must:
          - Keep the Cognito authorizer on every route and key every conversation read and delete by the verified user id.
          - Execute only a stored, unexpired, single-use proposal owned by the caller.
          - Delete only chat partitions; never account, property or policy records.
    Properties:
      Handler: handlers/chats.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref ChatsLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
          POLICY_TABLE_NAME: !Ref PolicyTable
      Policies:
        - Statement:
            - Sid: ReadChatAndOwnedRecords
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*", "CHAT#*", "IDEMPOTENCY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: WriteConfirmedRecords
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["CHAT#*", "IDEMPOTENCY#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: GuardConfirmedWrites
              Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["USER#*", "ORG#*", "CUSTOMER#*", "PROPERTY#*", "APPLICATION#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: UpdateChatProposalState
              Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["CHAT#*", "IDEMPOTENCY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: DeleteChatPartition
              Effect: Allow
              Action: [dynamodb:DeleteItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["CHAT#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ReadCurrentVerifiedPolicy
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*", "SOURCE#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: GuardActiveApplicationPolicy
              Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt PolicyTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PUBLISHED_POLICY#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
            - Sid: ListActiveApplicationPolicy
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${PolicyTable.Arn}/index/GSI5"
      Events:
        ListChats:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /chats, Method: GET }
        DeleteAllChats:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /chats, Method: DELETE }
        GetChat:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/chats/{chatId}", Method: GET }
        DeleteChat:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/chats/{chatId}", Method: DELETE }
        ConfirmProposal:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /chat/confirm, Method: POST }

  PriceAdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Lets policy administrators review, approve and reject price benchmark candidates with a separate-reviewer rule.
        must:
          - Require a verified ADMIN_POLICY or ADMIN Cognito group in handler code.
          - Touch only price benchmark and price status items.
    Properties:
      Handler: handlers/price-admin.handler
      CodeUri: ../../apps/api/dist
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref PriceAdminLogGroup
      Environment:
        Variables:
          CORE_TABLE_NAME: !Ref AnalysesTable
      Policies:
        - Statement:
            - Sid: ManagePriceBenchmarks
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !GetAtt AnalysesTable.Arn
              Condition:
                ForAllValues:StringLike:
                  "dynamodb:LeadingKeys": ["PRICE_BENCHMARK#*", "PRICE_STATUS#*"]
                "Null":
                  "dynamodb:LeadingKeys": "false"
      Events:
        ListPriceBenchmarks:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/pricing/benchmarks, Method: GET }
        CreatePriceBenchmark:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /admin/pricing/benchmarks, Method: POST }
        PriceBenchmarkDetail:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/pricing/benchmarks/{benchmarkId}", Method: GET }
        ApprovePriceBenchmark:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/pricing/benchmarks/{benchmarkId}/approve", Method: POST }
        RejectPriceBenchmark:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/admin/pricing/benchmarks/{benchmarkId}/reject", Method: POST }

  ChatGuardrail:
    Type: AWS::Bedrock::Guardrail
    Condition: ManagedGuardrail
    Properties:
      Name: !Sub "solarsaathi-chat-${Environment}"
      Description: Keeps the solar assistant on topic, blocks prompt attacks and masks sensitive identifiers.
      BlockedInputMessaging: "I can help with rooftop solar, electricity bills, subsidies and installation. I cannot help with that request."
      BlockedOutputsMessaging: "I cannot share that response. Please ask me something about rooftop solar."
      TopicPolicyConfig:
        TopicsConfig:
          - Name: NonSolarRequests
            Type: DENY
            Definition: Requests unrelated to rooftop solar, electricity bills, roofs, subsidies, installation or using the SolarSaathi app, such as general chat, coding help, homework, entertainment or politics.
            Examples:
              - Write a Python script for me
              - Who will win the cricket match
              - Tell me a joke
          - Name: LegalAdvice
            Type: DENY
            Definition: Requests for legal advice, contract interpretation or dispute strategy.
            Examples:
              - Can I sue my installer
              - Review this legal contract for me
          - Name: MedicalAdvice
            Type: DENY
            Definition: Requests for medical diagnosis, treatment or medication advice.
            Examples:
              - What medicine should I take for a headache
          - Name: InvestmentAdvice
            Type: DENY
            Definition: Requests for investment, trading, loan or insurance product advice beyond the solar cost and savings estimates the app calculates.
            Examples:
              - Which stocks should I buy
              - Should I invest in crypto
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: VIOLENCE
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
      WordPolicyConfig:
        ManagedWordListsConfig:
          - Type: PROFANITY
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: PASSWORD
            Action: ANONYMIZE
          - Type: PIN
            Action: ANONYMIZE
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: ANONYMIZE
          - Type: CREDIT_DEBIT_CARD_CVV
            Action: ANONYMIZE
          - Type: INTERNATIONAL_BANK_ACCOUNT_NUMBER
            Action: ANONYMIZE
        RegexesConfig:
          - Name: AadhaarNumber
            Description: Twelve digit Aadhaar style number
            Pattern: '\b[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}\b'
            Action: ANONYMIZE
          - Name: PanNumber
            Description: Indian PAN
            Pattern: '\b[A-Z]{5}[0-9]{4}[A-Z]\b'
            Action: ANONYMIZE
          - Name: IfscCode
            Description: Indian bank IFSC
            Pattern: '\b[A-Z]{4}0[A-Z0-9]{6}\b'
            Action: ANONYMIZE
          - Name: BankAccountNumber
            Description: Account number after an account label
            Pattern: '([Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Aa]/[Cc]|[Aa][Cc][Cc][Tt])[^0-9]{0,20}[0-9]{9,18}'
            Action: ANONYMIZE
          - Name: OneTimePassword
            Description: OTP shared with a label
            Pattern: '([Oo][Tt][Pp]|OTP|[Oo]ne[- ][Tt]ime [A-Za-z]+|[Vv]erification code)[^0-9]{0,12}[0-9]{4,8}'
            Action: ANONYMIZE
          - Name: ConsumerNumber
            Description: Electricity consumer number after a label
            Pattern: '([Cc]onsumer|CONSUMER|[Kk])[ ]?([Nn]o|[Nn]umber|[Ii][Dd]|NO|NUMBER)[^A-Za-z0-9]{0,6}[A-Za-z0-9-]{6,20}'
            Action: ANONYMIZE

  ChatGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Condition: ManagedGuardrail
    Properties:
      GuardrailIdentifier: !GetAtt ChatGuardrail.GuardrailId
      Description: Immutable version used by the chat assistant.

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: organizationId
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "128"
      UserPoolTags:
        Project: SolarSaathi
        Environment: !Ref Environment

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleFederationEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleOAuthClientId
        client_secret: !Sub "{{resolve:secretsmanager:${GoogleOAuthSecretArn}:SecretString:clientSecret}}"
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 10
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      CallbackURLs:
        - !Sub "${ApplicationOrigin}/auth/callback"
      LogoutURLs:
        - !Sub "${ApplicationOrigin}/auth/sign-in"
      SupportedIdentityProviders: !If
        - GoogleFederationEnabled
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      ReadAttributes: [email, email_verified, name, "custom:organizationId"]
      WriteAttributes: [email, name]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  HomeownerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: HOMEOWNER
      Description: Homeowner identity; property ownership is enforced separately by backend APIs.

  BrokerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: BROKER
      Description: Administrator-assigned broker membership; organization ownership is enforced separately.

  PolicyAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ADMIN_POLICY
      Description: Privileged policy source and document administration; membership is assigned out of band.

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: ADMIN
      Description: Privileged platform administration; membership is assigned out of band.

  PolicyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: N
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
        - AttributeName: GSI4PK
          AttributeType: S
        - AttributeName: GSI4SK
          AttributeType: S
        - AttributeName: GSI5PK
          AttributeType: S
        - AttributeName: GSI5SK
          AttributeType: S
        - AttributeName: GSI6PK
          AttributeType: S
        - AttributeName: GSI6SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI4
          KeySchema:
            - AttributeName: GSI4PK
              KeyType: HASH
            - AttributeName: GSI4SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI5
          KeySchema:
            - AttributeName: GSI5PK
              KeyType: HASH
            - AttributeName: GSI5SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI6
          KeySchema:
            - AttributeName: GSI6PK
              KeyType: HASH
            - AttributeName: GSI6SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

  PolicyDocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

  DesignAssetBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireInspirationalImages
            Status: Enabled
            Prefix: generated/
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref ApplicationOrigin]
            AllowedMethods: [GET]
            AllowedHeaders: ["*"]
            MaxAge: 300
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

  # Private applicant documents (ID, bill, bank proof). Policy: docs/security.md "Application document uploads".
  ApplicationDocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireApplicantDocuments
            Status: Enabled
            Prefix: applications/
            ExpirationInDays: 365
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref ApplicationOrigin]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: [content-type]
            MaxAge: 300
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: PersonalDocuments

  ApplicationDocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ApplicationDocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ApplicationDocumentBucket.Arn
              - !Sub "${ApplicationDocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DesignAssetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DesignAssetBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DesignAssetBucket.Arn
              - !Sub "${DesignAssetBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  PolicyDocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PolicyDocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PolicyDocumentBucket.Arn
              - !Sub "${PolicyDocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyUnconditionalPolicyObjectWrites
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              - !Sub "${PolicyDocumentBucket.Arn}/raw/*"
              - !Sub "${PolicyDocumentBucket.Arn}/derived/*"
            Condition:
              "Null":
                "s3:if-none-match": "true"
              Bool:
                s3:ObjectCreationOperation: "true"

  AnalysesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores the versioned core entities in one encrypted table; owner and organization indexes support scoped property listings.
        must:
          - Retain data on stack deletion or replacement.
          - GSI1 and GSI2 must project full property records for repository validation.
          - The expiry attribute must match the SOLAR_CACHE schema; application code still checks expiry before reads.
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAtEpochSeconds
        Enabled: true
      Tags:
        - Key: Project
          Value: SolarSaathi
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ChatStreamUrl:
    Description: Streaming assistant endpoint (Lambda Function URL). Set NEXT_PUBLIC_CHAT_STREAM_URL to this value.
    Value: !GetAtt ChatAgentFunctionUrl.FunctionUrl
  ChatGuardrailId:
    Description: Bedrock guardrail applied to every assistant turn.
    Value: !If [ExternalGuardrail, !Ref GuardrailId, !GetAtt ChatGuardrail.GuardrailId]
  ApiUrl:
    Description: API base URL; roof and advisor endpoints remain unavailable.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1"
  AnalysesTableName:
    Description: Private core entity table used by the authenticated core API.
    Value: !Ref AnalysesTable
  PolicyTableName:
    Description: Private isolated registry and immutable policy-document metadata table.
    Value: !Ref PolicyTable
  PolicyDocumentBucketName:
    Description: Private versioned raw and extracted policy-document archive.
    Value: !Ref PolicyDocumentBucket
  DesignAssetBucketName:
    Description: Private short-lived inspirational design image bucket.
    Value: !Ref DesignAssetBucket
  ApplicationDocumentBucketName:
    Description: Private applicant document bucket (365-day expiry).
    Value: !Ref ApplicationDocumentBucket
  CognitoUserPoolId:
    Description: Public user pool identifier for frontend configuration.
    Value: !Ref UserPool
  CognitoClientId:
    Description: Public app client identifier; no client secret is generated.
    Value: !Ref UserPoolClient
  CognitoDomainHost:
    Description: Public managed-login hostname, without scheme or path.
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  CognitoRedirectSignIn:
    Description: Exact registered application callback URL.
    Value: !Sub "${ApplicationOrigin}/auth/callback"
  CognitoRedirectSignOut:
    Description: Exact registered application sign-out URL.
    Value: !Sub "${ApplicationOrigin}/auth/sign-in"
