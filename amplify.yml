version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@10.34.6 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - node scripts/write-amplify-public-env.mjs
            - pnpm --filter @solarsaathi/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
